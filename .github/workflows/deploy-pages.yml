# Builds the static site and publishes ./out to GitHub Pages on every push to main.
#
# One-time setup in the repo:
#   1. Settings -> Pages -> Source: "GitHub Actions"
#   2. Settings -> Pages -> Custom domain: zyke.in  (this writes public/CNAME's value)
#   3. Point DNS at GitHub Pages. See "Deploying" in README.md.
#
# Optional, for the Google tag. Add under Settings -> Secrets and variables ->
# Actions -> Variables. Leave them unset and no analytics code is emitted.
#   GA_ID                       e.g. G-XXXXXXXXXX
#   GTM_ID                      e.g. GTM-XXXXXXX
#   GOOGLE_SITE_VERIFICATION    the token from Search Console
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_GA_ID: ${{ vars.GA_ID }}
          NEXT_PUBLIC_GTM_ID: ${{ vars.GTM_ID }}
          NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
      - name: Confirm the export looks right
        run: |
          test -f out/index.html
          test -f out/.nojekyll
          test -f out/CNAME
          test -f out/robots.txt
          test -f out/llms.txt
          test -f out/sitemap.xml
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
